<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nubiru Stream</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#050712;
  color:white;
}

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:#080b16;
  padding:18px;
  position:fixed;
  top:0;
  bottom:0;
  overflow:auto;
  z-index:20;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#8b5cf6;
  margin-bottom:20px;
}

.sidebar button,
.sidebar a{
  display:block;
  width:100%;
  margin-bottom:10px;
  text-align:left;
  background:#111827;
  color:white;
  border:0;
  border-radius:16px;
  padding:14px;
  cursor:pointer;
  font-size:16px;
  text-decoration:none;
  font-weight:bold;
}

.sidebar button:hover{
  background:#8b5cf6;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
}

.topbar{
  position:sticky;
  top:0;
  background:rgba(5,7,18,.96);
  backdrop-filter:blur(12px);
  z-index:15;
  padding:14px;
}

.gridTop{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:10px;
}

input,button,select{
  padding:12px;
  border-radius:14px;
  border:0;
  font-size:15px;
}

input,select{
  background:#1f2937;
  color:white;
}

button{
  background:#8b5cf6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  min-height:360px;
  padding:60px 30px;
  background:linear-gradient(90deg,#111827,#050712);
  display:flex;
  align-items:end;
}

.hero h1{
  font-size:46px;
  margin:0;
}

.hero p{
  max-width:760px;
  color:#d1d5db;
  font-size:18px;
}

.heroActions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.section{
  padding:22px;
}

.section h2{
  font-size:34px;
  margin:0 0 22px;
}

.rail{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:#111827;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.card:hover{
  transform:scale(1.03);
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#222;
  display:block;
}

.cardInfo{
  padding:12px;
}

.cardInfo b{
  display:block;
  font-size:20px;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.small{
  color:#cbd5e1;
  font-size:14px;
}

.cardButtons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.cardButtons button{
  flex:1;
  padding:10px;
  border-radius:12px;
}

.player{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:200;
}

.playerTop{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:18px;
  z-index:210;
  display:flex;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:300;
  place-items:center;
  padding:12px;
}

.modalBox{
  background:#111827;
  padding:22px;
  border-radius:18px;
  width:100%;
  max-width:760px;
  display:grid;
  gap:10px;
  max-height:90vh;
  overflow:auto;
}

.episode{
  background:#1f2937;
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.error{color:#f87171}
.success{color:#4ade80}

@media(max-width:900px){
  .app{
    display:block;
  }

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    bottom:auto;
    padding:18px 16px;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .topbar{
    position:relative;
    padding:16px;
  }

  .gridTop{
    grid-template-columns:1fr;
  }

  input,button,select{
    font-size:16px;
    padding:15px;
  }

  .hero{
    min-height:300px;
    padding:44px 24px;
  }

  .hero h1{
    font-size:40px;
  }

  .hero p{
    font-size:17px;
  }

  .section{
    padding:18px 16px;
  }

  .section h2{
    font-size:32px;
  }

  .rail{
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:14px;
  }

  .cardInfo b{
    font-size:18px;
  }

  .small{
    font-size:13px;
  }

  .cardButtons{
    gap:6px;
  }

  .cardButtons button{
    min-width:0;
    padding:10px 6px;
    font-size:18px;
  }

  .playerTop{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(max-width:420px){
  .rail{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }

  .hero h1{
    font-size:34px;
  }

  .logo{
    font-size:30px;
  }
}
</style>

<style id="nubiru-premium-rails">
.rail{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding:10px 0 22px;
  scroll-behavior:smooth;
}
.rail::-webkit-scrollbar{
  height:6px;
}
.rail::-webkit-scrollbar-thumb{
  background:#6d28d9;
  border-radius:10px;
}
.card{
  min-width:180px;
  width:180px;
  background:#111827;
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
  position:relative;
  box-shadow:0 0 20px rgba(0,0,0,.45);
}
.card:hover{
  transform:scale(1.06);
  z-index:20;
}
.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  background:#222;
}
.progress-bar{
  width:100%;
  height:6px;
  background:#374151;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}
.progress-fill{
  height:100%;
  background:#8b5cf6;
}
.top-badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#ef4444;
  color:white;
  font-weight:bold;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  z-index:5;
}
.cardInfo button{
  margin-top:6px;
}
</style>


<style id="nubiru-cinematic-rails">
.rail{
  display:flex !important;
  gap:14px;
  overflow-x:auto;
  padding:10px 4px 18px;
  scroll-behavior:smooth;
}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{
  background:#7c3aed;
  border-radius:20px;
}
.card{
  min-width:160px !important;
  max-width:160px !important;
  background:#111827;
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
  box-shadow:0 0 20px rgba(124,58,237,.25);
}
.card:hover{
  transform:scale(1.05);
}
.card img{
  width:100%;
  height:240px;
  object-fit:cover;
  background:#111827;
}
.cardInfo{
  padding:10px;
}
.progress-bar{
  width:100%;
  height:6px;
  background:#1f2937;
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}
.progress-fill{
  height:100%;
  background:#7c3aed;
}
</style>


<style id="hero-cinematic-autoplay">
.hero{
  position:relative;
  overflow:hidden;
  min-height:520px !important;
  background:#050712;
}
#heroVideoBg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  opacity:.28;
  transform:scale(1.18);
  pointer-events:none;
  z-index:0;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,#050712 0%,rgba(5,7,18,.85) 30%,rgba(5,7,18,.25) 100%),
    linear-gradient(0deg,#050712 0%,transparent 45%);
  z-index:1;
}
.hero > div{
  position:relative;
  z-index:2;
}
.heroBadge{
  display:inline-block;
  background:#8b5cf6;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}
.heroActions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}
.heroActions button{
  padding:12px 18px;
  border-radius:14px;
}
@media(max-width:900px){
  .hero{min-height:440px !important}
  #heroVideoBg{opacity:.18}
}
</style>

</head>

<body>

<div class="app">
<aside class="sidebar">
  <div class="logo">Nubiru Stream</div>
  <div id="userBox"></div>
  <button onclick="showSection('home')">Acasă</button>
  <button onclick="showSection('watchlist')">❤️ Watchlist</button>
  <button onclick="showSection('history')">▶ Continue Watching</button>
  <button onclick="showSection('recommendations')">✨ Pentru tine</button>
  <a href="/admin.html">Admin PRO</a>
</aside>

<main class="main">
  <div class="topbar">
    <div class="gridTop">
      <input id="q" placeholder="Caută titlu, actor, regizor...">
      <input id="actor" placeholder="Actor">
      <input id="genre" placeholder="Gen">
      <input id="country" placeholder="Țară">
      <button onclick="search()">Search</button>
    </div>
  </div>

  <section class="hero" id="hero">
    <div>
      <h1 id="heroTitle">Nubiru Stream</h1>
      <p id="heroDesc">Player cu filme, seriale, sezoane și episoade.</p>
      <div class="heroActions">
        <button id="heroPlayBtn" onclick="playHero()">▶ Play</button>
        <button onclick="openEpisodes(heroItem)">📺 Episoade</button>
        <button onclick="addHeroWatchlist()">❤️ Watchlist</button>
      </div>
    </div>
  </section>

  <section class="section" id="homeSection">
    <h2>Continue Watching</h2>
<div class="rail" id="homeContinue"></div>
<h2>Trending</h2>
<div class="rail" id="homeTrending"></div>
<h2>AI Picks</h2>
<div class="rail" id="homeAiPicks"></div>
<h2>Semantic AI</h2>
<div class="rail" id="homeSemantic"></div>
<h2>Filme</h2>
<div class="rail" id="homeMovies"></div>
<h2>Seriale</h2>
<div class="rail" id="homeSeries"></div>
<h2>Catalog</h2>
<div class="rail" id="catalog"></div>
  </section>

  <section class="section" id="watchlistSection" style="display:none">
    <h2>Watchlist</h2>
    <div class="rail" id="watchlistBox"></div>
  </section>

  <section class="section" id="historySection" style="display:none">
    <h2>Continue Watching</h2>
    <div class="rail" id="historyBox"></div>
  </section>

  <section class="section" id="recommendationsSection" style="display:none">
    <h2>Pentru tine</h2>
    <div class="rail" id="recommendationsBox"></div>
  </section>
</main>
</div>

<section class="player" id="player">
  <div class="playerTop">
    <div>
<strong id="playerTitle">Player</strong>
<div id="playerSourceBar" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;max-width:70vw"></div>
</div>
    <div>
      <button onclick="saveProgress()">Salvează progres</button>
      <button onclick="closePlayer()">Închide</button>
    </div>
  </div>
  <iframe id="playerFrame" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>

</section>

<div class="modal" id="authModal">
  <div class="modalBox">
    <h2>Cont Nubiru</h2>
    <div id="authMessage"></div>
    <input id="name" placeholder="Nume">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Parolă">
    <button onclick="register()">Creează cont</button>
    <button onclick="login()">Login</button>
    <button onclick="authModal.style.display='none'">Închide</button>
  </div>
</div>

<div class="modal" id="episodesModal">
  <div class="modalBox">
    <h2 id="episodesTitle">Episoade</h2>
    <div id="seasonsBox"></div>
    <div id="episodesBox"></div>
    <button onclick="episodesModal.style.display='none'">Închide</button>
  </div>
</div>

<script>
let token=localStorage.getItem("token")||"";
let user=JSON.parse(localStorage.getItem("user")||"null");
let items=[];
let heroItem=null;
let currentItem=null;

const fallbackPoster = "https://via.placeholder.com/300x450/111827/ffffff?text=Nubiru";

function safeImg(url){
  if(!url) return fallbackPoster;
  return url;
}

function authHeaders(){
  return token
    ? {Authorization:"Bearer "+token,"Content-Type":"application/json"}
    : {"Content-Type":"application/json"};
}

function showMsg(msg,type="error"){
  authMessage.innerHTML=`<p class="${type}">${msg}</p>`;
}

function renderUser(){
  userBox.innerHTML=user
    ? `<p class="small">Salut, ${user.name||user.email}</p><button onclick="logout()">Logout</button>`
    : `<button onclick="openAuth()">Login / Register</button>`;
}
renderUser();

function openAuth(){
  authMessage.innerHTML="";
  authModal.style.display="grid";
}


async function loadHomepageRails(){
  const userId = user?.id || 1;

  try{
    const res = await fetch("/homepage?user_id="+userId);
    const data = await res.json();

    renderRail("homeContinue", data.continueWatching || [], true);
    renderRail("homeTrending", data.trending || []);
    renderRail("homeAiPicks", data.aiPicks || []);
    renderRail("homeSemantic", data.semantic || []);
    renderRail("homeMovies", data.movies || []);
    renderRail("homeSeries", data.series || []);
  }catch(e){
    console.log("homepage rails error", e);
  }
}

function renderRail(id,data,isContinue=false){
  const box = document.getElementById(id);
  if(!box) return;

  const list = data || [];

  if(!list.length){
    box.innerHTML = "<span class='small'>Nimic disponibil.</span>";
    return;
  }

  box.innerHTML = list.map(x=>{
    if(isContinue){
      return `
      <div class="card" onclick='resumeContent(${JSON.stringify(x)})'>
        <img src="${x.poster_url || "https://via.placeholder.com/300x450"}">
        <div class="cardInfo">
          <b>${x.title}</b><br>
          <span class="small">Progres: ${x.percent || 0}%</span>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${x.percent || 0}%"></div>
          </div>
          <button onclick='event.stopPropagation();resumeContent(${JSON.stringify(x)})'>Resume</button>
        </div>
      </div>`;
    }

    return card(x);
  }).join("");
}

async function load(){
  const res=await fetch("/content/search?sort=popular");
  items=await res.json();
  heroItem=items[0];
  renderHero(heroItem);
  catalog.innerHTML=items.map(card).join("");
}
load();

setTimeout(()=>{
  const btn = document.getElementById("heroPlayBtn");
  if(btn){
    btn.onclick = function(){
      if(heroItem){
        playItem(heroItem);
      }else{
        alert("Nu există content selectat.");
      }
    };
  }
},1000);



let heroTrailerMuted = true;

async function loadHeroTrailer(item){
  try{
    if(!item) return;

    let old = document.getElementById("heroVideoBg");
    if(old) old.remove();

    const res = await fetch("/content-play/"+item.id);
    const data = await res.json();
    const trailer = data.trailer || data.primary;

    if(!trailer) return;

    let url = trailer.normalized_url || trailer.url || "";
    if(!url) return;

    url = toEmbed(url);

    if(url.includes("youtube.com/embed/")){
      url += (url.includes("?") ? "&" : "?") + "autoplay=1&mute=1&controls=0&loop=1&playlist=" + url.split("/embed/")[1].split("?")[0];
    }

    const iframe = document.createElement("iframe");
    iframe.id = "heroVideoBg";
    iframe.src = url;
    iframe.allow = "autoplay; fullscreen; picture-in-picture";
    iframe.setAttribute("allowfullscreen","true");

    hero.prepend(iframe);
  }catch(e){
    console.log("hero trailer error", e);
  }
}

function toggleHeroTrailer(){
  const frame = document.getElementById("heroVideoBg");
  if(!frame){
    if(heroItem) loadHeroTrailer(heroItem);
    return;
  }

  frame.style.display = frame.style.display === "none" ? "block" : "none";
}

function renderHero(item){
  if(!item)return;
  heroItem=item;
  heroTitle.innerText=item.title;
  heroDesc.innerText=item.description||"";
  hero.style.background=`linear-gradient(90deg,rgba(5,7,18,.95),rgba(5,7,18,.35)),url('${item.backdrop_url||item.poster_url||""}') center/cover`;
  loadHeroTrailer(item);
}

function escapeJson(obj){
  return JSON.stringify(obj).replace(/'/g,"&#39;");
}

function card(item){
  return `
  <div class="card" onclick='openItem(${escapeJson(item)})'>
    <img class="poster" src="${safeImg(item.poster_url)}" onerror="this.src='${fallbackPoster}'">
    <div class="cardInfo">
      <b>${item.title || ""}</b>
      <span class="small">${item.year || ""} ${item.genres || item.genre || ""}</span>
      <div class="cardButtons">
        <button onclick='event.stopPropagation();playItem(${escapeJson(item)})'>▶</button>
        <button onclick='event.stopPropagation();openEpisodes(${escapeJson(item)})'>📺</button>
        <button onclick='event.stopPropagation();addWatchlist(${item.id})'>❤️</button>
      </div>
    </div>
  </div>`;
}

async function search(){
  const p=new URLSearchParams();
  if(q.value)p.set("q",q.value);
  if(actor.value)p.set("actor",actor.value);
  if(genre.value)p.set("genre",genre.value);
  if(country.value)p.set("country",country.value);

  const res=await fetch("/content/search?"+p.toString());
  items=await res.json();
  catalog.innerHTML=items.map(card).join("");
  renderHero(items[0]);
}

function openItem(item){
  renderHero(item);
}

function getPlayable(item){
  return item.iframe_url || item.youtube_trailer || item.source_url || "";
}



let playerAvailableSources = [];

function renderSourceButtons(sources){
  const box = document.getElementById("playerSourceButtons");
  if(!box) return;

  playerAvailableSources = sources || [];

  box.innerHTML = playerAvailableSources.map((src,index)=>{
    const label = src.is_trailer ? "Trailer" : (src.label || ("Server "+(index+1)));
    const quality = src.quality ? " " + src.quality : "";
    const lang = src.language ? " " + src.language : "";
    return `<button style="background:#8b5cf6;color:white;padding:10px;border-radius:12px;border:0;font-weight:bold" onclick="playSourceIndex(${index})">${label}${quality}${lang}</button>`;
  }).join("");
}

function playSourceIndex(index){
  const src = playerAvailableSources[index];
  if(!src) return;

  const url = src.normalized_url || src.url;
  playerFrame.src = toEmbed(url);
  playerTitle.innerText = (currentItem?.title || "Player") + " - " + (src.label || src.source_type || "Source");
}


let pendingPlayItem = null;
let pendingSources = [];

function openSourcePicker(item, sources){
  pendingPlayItem = item;
  pendingSources = sources || [];

  sourcePickerTitle.innerText = item.title || "";

  sourcePickerList.innerHTML = pendingSources.map((src,i)=>{
    const label = src.is_trailer ? "🎬 Trailer" : (src.label || "▶ Server "+(i+1));
    const q = src.quality ? " - " + src.quality : "";
    const l = src.language ? " - " + src.language : "";
    return `
      <div class="episode">
        <div>
          <b>${label}${q}${l}</b>
          <p class="small">${src.detected_type || src.source_type || ""}</p>
        </div>
        <button onclick="playPickedSource(${i})">Play</button>
      </div>
    `;
  }).join("");

  sourcePickerModal.style.display = "grid";
}

function playPickedSource(index){
  const src = pendingSources[index];
  if(!src || !pendingPlayItem) return;

  const url = src.normalized_url || src.url;
  currentItem = pendingPlayItem;

  playerTitle.innerText = pendingPlayItem.title + " - " + (src.label || src.source_type || "Source");
  playerFrame.src = toEmbed(url);

  sourcePickerModal.style.display = "none";
  player.style.display = "block";

  fetch("/content/"+pendingPlayItem.id+"/view",{method:"POST"});
}

async function getSmartPlay(item){
  try{
    const res = await fetch("/content-play/"+item.id);
    const data = await res.json();
    const sources = data.sources || [];

    if(data.primary){
      return {
        url: data.primary.normalized_url || data.primary.url,
        type: data.primary.detected_type || data.primary.source_type || "iframe",
        label: data.primary.label || "Primary",
        sources: sources
      };
    }

    if(data.trailer){
      return {
        url: data.trailer.normalized_url || data.trailer.url,
        type: data.trailer.detected_type || data.trailer.source_type || "iframe",
        label: data.trailer.label || "Trailer",
        sources: sources
      };
    }
  }catch(e){
    console.log("getSmartPlay error", e);
  }

  return {
    url: getPlayable(item),
    type: "iframe",
    label: "Legacy",
    sources: []
  };
}


let playerSourcesList = [];

function renderPlayerSourceBar(sources){
  const bar = document.getElementById("playerSourceBar");
  if(!bar) return;

  playerSourcesList = sources || [];

  bar.innerHTML = playerSourcesList.map((src,i)=>{
    const label = src.is_trailer ? "🎬 Trailer" : (src.label || "▶ Server "+(i+1));
    const q = src.quality ? " " + src.quality : "";
    const l = src.language ? " " + src.language : "";
    return `<button style="background:#8b5cf6;color:white;border:0;border-radius:14px;padding:10px 14px;font-weight:bold;font-size:13px" onclick="playPlayerSource(${i})">${label}${q}${l}</button>`;
  }).join("");
}

function playPlayerSource(i){
  const src = playerSourcesList[i];
  if(!src) return;

  const url = src.normalized_url || src.url;
  playerFrame.src = toEmbed(url);
  playerTitle.innerText = (currentItem?.title || "Player") + " - " + (src.label || src.source_type || "Source");
}

async function playItem(item){
  const source = await getSmartPlay(item);
  const url = source.url;
  const sources = source.sources || [];

  if(sources.length > 1){
    openSourcePicker(item, sources);
    return;
  }

  if(!url)return alert("Nu are video/trailer.");

  currentItem=item;
  playerTitle.innerText=item.title + " - " + (source.label || "Play");
  playerFrame.src=toEmbed(url);
  player.style.display="block";
  startAutoSaveProgress();
  fetch("/content/"+item.id+"/view",{method:"POST"});
}

function playEpisode(ep, parentTitle){
  currentItem={id:ep.content_id,title:parentTitle || ep.title};
  playerTitle.innerText=`${parentTitle || ""} - S${ep.season_number}E${ep.episode_number}: ${ep.title}`;
  playerFrame.src=toEmbed(ep.iframe_url || ep.source_url || "");
  player.style.display="block";
  episodesModal.style.display="none";
}

function toEmbed(url){
  if(!url)return"";

  if(url.includes("<iframe")){
    const m=url.match(/src=["']([^"']+)["']/);
    return m?m[1]:"";
  }

  if(url.includes("youtube.com/watch")){
    const id=new URL(url).searchParams.get("v");
    return "https://www.youtube.com/embed/"+id;
  }

  if(url.includes("youtu.be/")){
    const id=url.split("youtu.be/")[1].split("?")[0];
    return "https://www.youtube.com/embed/"+id;
  }

  if(url.includes("vimeo.com/")){
    const id=url.split("vimeo.com/")[1].split("?")[0];
    return "https://player.vimeo.com/video/"+id;
  }

  if(url.includes("dailymotion.com/video/")){
    const id=url.split("/video/")[1].split("?")[0];
    return "https://www.dailymotion.com/embed/video/"+id;
  }

  return url;
}

function closePlayer(){
  playerFrame.src="";
  const bar=document.getElementById("playerSourceBar");
  if(bar)bar.innerHTML="";
  player.style.display="none";
}

async function openEpisodes(item){
  if(!item)return;

  episodesTitle.innerText="Episoade - " + item.title;
  episodesBox.innerHTML="Se încarcă...";
  seasonsBox.innerHTML="";
  episodesModal.style.display="grid";

  const seasonsRes=await fetch("/seasons/"+item.id);
  const seasons=await seasonsRes.json();

  const epsRes=await fetch("/episodes/"+item.id);
  const eps=await epsRes.json();

  if(seasons.length){
    seasonsBox.innerHTML=`
    <select id="seasonFilter">
      <option value="">Toate sezoanele</option>
      ${seasons.map(s=>`<option value="${s.season_number}">Sezonul ${s.season_number} - ${s.title||""}</option>`).join("")}
    </select>`;

    seasonFilter.onchange=()=>filterEpisodes(eps,item.title);
  }

  renderEpisodes(eps,item.title);
}

function filterEpisodes(eps,title){
  const val=Number(seasonFilter.value);
  const filtered=val?eps.filter(e=>e.season_number===val):eps;
  renderEpisodes(filtered,title);
}

function renderEpisodes(eps,title){
  episodesBox.innerHTML=eps.length
    ? eps.map(ep=>`
      <div class="episode">
        <div>
          <b>S${ep.season_number} E${ep.episode_number}: ${ep.title}</b>
          <p class="small">${ep.description||""}</p>
        </div>
        <button onclick='playEpisode(${escapeJson(ep)}, ${JSON.stringify(title)})'>▶ Play</button>
      </div>
    `).join("")
    : "Nu există episoade pentru acest conținut.";
}

async function register(){
  const res=await fetch("/auth/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:name.value,email:email.value,password:password.value})
  });

  const data=await res.json();

  if(!res.ok){
    showMsg(data.details||data.error||"Eroare register");
    return;
  }

  token=data.token;
  user=data.user;
  localStorage.setItem("token",token);
  localStorage.setItem("user",JSON.stringify(user));
  showMsg("Cont creat!","success");
  setTimeout(()=>authModal.style.display="none",600);
  renderUser();
}

async function login(){
  const res=await fetch("/auth/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:email.value,password:password.value})
  });

  const data=await res.json();

  if(!res.ok){
    showMsg(data.error||data.details||"Login greșit");
    return;
  }

  token=data.token;
  user=data.user;
  localStorage.setItem("token",token);
  localStorage.setItem("user",JSON.stringify(user));
  showMsg("Login reușit!","success");
  setTimeout(()=>authModal.style.display="none",600);
  renderUser();
}

function logout(){
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  token="";
  user=null;
  renderUser();
}

async function addWatchlist(id){
  if(!token)return openAuth();
  await fetch("/watchlist/"+id,{method:"POST",headers:authHeaders()});
  alert("Adăugat în watchlist");
}

function addHeroWatchlist(){
  if(heroItem)addWatchlist(heroItem.id);
}

async function loadWatchlist(){
  if(!token)return openAuth();
  const res=await fetch("/watchlist",{headers:authHeaders()});
  const data=await res.json();
  watchlistBox.innerHTML=data.length?data.map(card).join(""):"Nu ai nimic în watchlist.";
}

async function loadHistory(){
  const userId = user?.id || 1;
  const res = await fetch("/continue-watching?user_id="+userId);
  const data = await res.json();

  historyBox.innerHTML = data.length ? data.map(x=>`
    <div class="card" onclick='resumeContent(${JSON.stringify(x)})'>
      <img src="${x.poster_url || "https://via.placeholder.com/300x450"}">
      <div class="cardInfo">
        <b>${x.title}</b><br>
        <span class="small">${x.episode_title ? "S"+x.season_number+" E"+x.episode_number+" - "+x.episode_title : ""}</span><br>
        <span class="small">Progres: ${x.percent || 0}%</span>
        <div style="height:6px;background:#374151;border-radius:8px;margin-top:6px">
          <div style="height:6px;background:#8b5cf6;border-radius:8px;width:${x.percent || 0}%"></div>
        </div>
        <button onclick='event.stopPropagation();resumeContent(${JSON.stringify(x)})'>Resume</button>
      </div>
    </div>
  `).join("") : "Nu ai continue watching.";
}

async function resumeContent(item){
  const content = items.find(x=>x.id === item.content_id) || {
    id:item.content_id,
    title:item.title,
    poster_url:item.poster_url,
    backdrop_url:item.backdrop_url
  };

  await playItem(content);
}


async function loadRecommendations(){
  if(!token)return openAuth();
  const res=await fetch("/recommendations",{headers:authHeaders()});
  const data=await res.json();
  recommendationsBox.innerHTML=data.length?data.map(card).join(""):"Nu există recomandări încă.";
}

let autoSaveTimer = null;
let playStartedAt = null;

function startAutoSaveProgress(){
  stopAutoSaveProgress();

  if(!currentItem) return;

  playStartedAt = Date.now();

  autoSaveTimer = setInterval(()=>{
    autoSaveProgressNow();
  },15000);
}

function stopAutoSaveProgress(){
  if(autoSaveTimer){
    clearInterval(autoSaveTimer);
    autoSaveTimer = null;
  }
}

async function autoSaveProgressNow(){
  if(!currentItem || !playStartedAt) return;

  const userId = user?.id || 1;
  const watchedSeconds = Math.floor((Date.now() - playStartedAt) / 1000);

  await fetch("/watch-progress",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      user_id:userId,
      content_id:currentItem.id,
      episode_id:null,
      progress_seconds:Math.max(120, watchedSeconds),
      duration_seconds:1440,
      completed:false
    })
  });
}

async function saveProgress(){
  if(!currentItem)return;

  const userId = user?.id || 1;

  const res = await fetch("/watch-progress",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      user_id:userId,
      content_id:currentItem.id,
      episode_id:null,
      progress_seconds:120,
      duration_seconds:1440,
      completed:false
    })
  });

  const data = await res.json();

  if(res.ok){
    alert("Progres salvat: "+(data.percent || 0)+"%");
  }else{
    alert(data.details || data.error || "Eroare progres");
  }
}


function showSection(section){
  homeSection.style.display=section==="home"?"block":"none";
  watchlistSection.style.display=section==="watchlist"?"block":"none";
  historySection.style.display=section==="history"?"block":"none";
  recommendationsSection.style.display=section==="recommendations"?"block":"none";

  if(section==="watchlist")loadWatchlist();
  if(section==="history")loadHistory();
  if(section==="recommendations")loadRecommendations();
}

async function forceHomepageRails(){
  const userId = user?.id || 1;

  try{
    const res = await fetch("/homepage?user_id="+userId);
    const data = await res.json();

    forceRenderRail("homeContinue", data.continueWatching || [], true);
    forceRenderRail("homeTrending", data.trending || []);
    forceRenderRail("homeAiPicks", data.aiPicks || []);
    forceRenderRail("homeSemantic", data.semantic || []);
    forceRenderRail("homeMovies", data.movies || []);
    forceRenderRail("homeSeries", data.series || []);
  }catch(e){
    console.log("force homepage rails error", e);
  }
}

function forceRenderRail(id, list, isContinue=false){
  const box = document.getElementById(id);
  if(!box) return;

  if(!list || !list.length){
    box.innerHTML = "<span class='small'>Nimic disponibil.</span>";
    return;
  }

  box.innerHTML = list.map(x=>{
    if(isContinue){
      return `
      <div class="card" onclick='resumeContent(${JSON.stringify(x)})'>
        <img src="${x.poster_url || "https://via.placeholder.com/300x450"}">
        <div class="cardInfo">
          <b>${x.title}</b><br>
          <span class="small">Progres: ${x.percent || 0}%</span>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${x.percent || 0}%"></div>
          </div>
          <button onclick='event.stopPropagation();resumeContent(${JSON.stringify(x)})'>Resume</button>
        </div>
      </div>`;
    }

    return card(x);
  }).join("");
}

setTimeout(forceHomepageRails, 800);
setTimeout(forceHomepageRails, 2000);
