<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nubiru Stream</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#050712;
  color:white;
}

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:#080b16;
  padding:18px;
  position:fixed;
  top:0;
  bottom:0;
  overflow:auto;
  z-index:20;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#8b5cf6;
  margin-bottom:20px;
}

.sidebar button,
.sidebar a{
  display:block;
  width:100%;
  margin-bottom:10px;
  text-align:left;
  background:#111827;
  color:white;
  border:0;
  border-radius:16px;
  padding:14px;
  cursor:pointer;
  font-size:16px;
  text-decoration:none;
  font-weight:bold;
}

.sidebar button:hover{
  background:#8b5cf6;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
}

.topbar{
  position:sticky;
  top:0;
  background:rgba(5,7,18,.96);
  backdrop-filter:blur(12px);
  z-index:15;
  padding:14px;
}

.gridTop{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:10px;
}

input,button,select{
  padding:12px;
  border-radius:14px;
  border:0;
  font-size:15px;
}

input,select{
  background:#1f2937;
  color:white;
}

button{
  background:#8b5cf6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  min-height:360px;
  padding:60px 30px;
  background:linear-gradient(90deg,#111827,#050712);
  display:flex;
  align-items:end;
}

.hero h1{
  font-size:46px;
  margin:0;
}

.hero p{
  max-width:760px;
  color:#d1d5db;
  font-size:18px;
}

.heroActions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.section{
  padding:22px;
}

.section h2{
  font-size:34px;
  margin:0 0 22px;
}

.rail{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:#111827;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.card:hover{
  transform:scale(1.03);
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#222;
  display:block;
}

.cardInfo{
  padding:12px;
}

.cardInfo b{
  display:block;
  font-size:20px;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.small{
  color:#cbd5e1;
  font-size:14px;
}

.cardButtons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.cardButtons button{
  flex:1;
  padding:10px;
  border-radius:12px;
}

.player{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:200;
}

.playerTop{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:18px;
  z-index:210;
  display:flex;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:300;
  place-items:center;
  padding:12px;
}

.modalBox{
  background:#111827;
  padding:22px;
  border-radius:18px;
  width:100%;
  max-width:760px;
  display:grid;
  gap:10px;
  max-height:90vh;
  overflow:auto;
}

.episode{
  background:#1f2937;
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.error{color:#f87171}
.success{color:#4ade80}

@media(max-width:900px){
  .app{
    display:block;
  }

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    bottom:auto;
    padding:18px 16px;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .topbar{
    position:relative;
    padding:16px;
  }

  .gridTop{
    grid-template-columns:1fr;
  }

  input,button,select{
    font-size:16px;
    padding:15px;
  }

  .hero{
    min-height:300px;
    padding:44px 24px;
  }

  .hero h1{
    font-size:40px;
  }

  .hero p{
    font-size:17px;
  }

  .section{
    padding:18px 16px;
  }

  .section h2{
    font-size:32px;
  }

  .rail{
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:14px;
  }

  .cardInfo b{
    font-size:18px;
  }

  .small{
    font-size:13px;
  }

  .cardButtons{
    gap:6px;
  }

  .cardButtons button{
    min-width:0;
    padding:10px 6px;
    font-size:18px;
  }

  .playerTop{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(max-width:420px){
  .rail{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }

  .hero h1{
    font-size:34px;
  }

  .logo{
    font-size:30px;
  }
}
</style>

<style id="nubiru-premium-rails">
.rail{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding:10px 0 22px;
  scroll-behavior:smooth;
}
.rail::-webkit-scrollbar{
  height:6px;
}
.rail::-webkit-scrollbar-thumb{
  background:#6d28d9;
  border-radius:10px;
}
.card{
  min-width:180px;
  width:180px;
  background:#111827;
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
  position:relative;
  box-shadow:0 0 20px rgba(0,0,0,.45);
}
.card:hover{
  transform:scale(1.06);
  z-index:20;
}
.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  background:#222;
}
.progress-bar{
  width:100%;
  height:6px;
  background:#374151;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}
.progress-fill{
  height:100%;
  background:#8b5cf6;
}
.top-badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#ef4444;
  color:white;
  font-weight:bold;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  z-index:5;
}
.cardInfo button{
  margin-top:6px;
}
</style>


<style id="nubiru-cinematic-rails">
.rail{
  display:flex !important;
  gap:14px;
  overflow-x:auto;
  padding:10px 4px 18px;
  scroll-behavior:smooth;
}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{
  background:#7c3aed;
  border-radius:20px;
}
.card{
  min-width:160px !important;
  max-width:160px !important;
  background:#111827;
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
  box-shadow:0 0 20px rgba(124,58,237,.25);
}
.card:hover{
  transform:scale(1.05);
}
.card img{
  width:100%;
  height:240px;
  object-fit:cover;
  background:#111827;
}
.cardInfo{
  padding:10px;
}
.progress-bar{
  width:100%;
  height:6px;
  background:#1f2937;
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}
.progress-fill{
  height:100%;
  background:#7c3aed;
}
</style>


<style id="hero-cinematic-autoplay">
.hero{
  position:relative;
  overflow:hidden;
  min-height:520px !important;
  background:#050712;
}
#heroVideoBg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  opacity:.28;
  transform:scale(1.18);
  pointer-events:none;
  z-index:0;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,#050712 0%,rgba(5,7,18,.85) 30%,rgba(5,7,18,.25) 100%),
    linear-gradient(0deg,#050712 0%,transparent 45%);
  z-index:1;
}
.hero > div{
  position:relative;
  z-index:2;
}
.heroBadge{
  display:inline-block;
  background:#8b5cf6;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}
.heroActions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}
.heroActions button{
  padding:12px 18px;
  border-radius:14px;
}
@media(max-width:900px){
  .hero{min-height:440px !important}
  #heroVideoBg{opacity:.18}
}
</style>

</head>

<body>

<div class="app">
<aside class="sidebar">
  <div class="logo">Nubiru Stream</div>
  <div id="userBox"></div>
  <button onclick="showSection('home')">Acasă</button>
  <button onclick="showSection('watchlist')">❤️ Watchlist</button>
  <button onclick="showSection('history')">▶ Continue Watching</button>
  <button onclick="showSection('recommendations')">✨ Pentru tine</button>
  <a href="/admin.html">Admin PRO</a>
</aside>

<main class="main">
  <div class="topbar">
    <div class="gridTop">
      <input id="q" placeholder="Caută titlu, actor, regizor...">
      <input id="actor" placeholder="Actor">
      <input id="genre" placeholder="Gen">
      <input id="country" placeholder="Țară">
      <button onclick="search()">Search</button>
    </div>
  </div>

  <section class="hero" id="hero">
    <div>
      <h1 id="heroTitle">Nubiru Stream</h1>
      <p id="heroDesc">Player cu filme, seriale, sezoane și episoade.</p>
      <div class="heroActions">
        <button id="heroPlayBtn" onclick="playHero()">▶ Play</button>
        <button onclick="openEpisodes(heroItem)">📺 Episoade</button>
        <button onclick="addHeroWatchlist()">❤️ Watchlist</button>
      </div>
    </div>
  </section>

  <section class="section" id="homeSection">
    <h2>Continue Watching</h2>
<div class="rail" id="homeContinue"></div>
<h2>Trending</h2>
<div class="rail" id="homeTrending"></div>
<h2>AI Picks</h2>
<div class="rail" id="homeAiPicks"></div>
<h2>Semantic AI</h2>
<div class="rail" id="homeSemantic"></div>
<h2>Filme</h2>
<div class="rail" id="homeMovies"></div>
<h2>Seriale</h2>
<div class="rail" id="homeSeries"></div>
<h2>Catalog</h2>
<div class="rail" id="catalog"></div>
  </section>

  <section class="section" id="watchlistSection" style="display:none">
    <h2>Watchlist</h2>
    <div class="rail" id="watchlistBox"></div>
  </section>

  <section class="section" id="historySection" style="display:none">
    <h2>Continue Watching</h2>
    <div class="rail" id="historyBox"></div>
  </section>

  <section class="section" id="recommendationsSection" style="display:none">
    <h2>Pentru tine</h2>
    <div class="rail" id="recommendationsBox"></div>
  </section>
</main>
</div>

<section class="player" id="player">
  <div class="playerTop">
    <div>
<strong id="playerTitle">Player</strong>
<div id="playerSourceBar" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;max-width:70vw"></div>
</div>
    <div>
      <button onclick="saveProgress()">Salvează progres</button>
      <button onclick="closePlayer()">Închide</button>
    </div>
  </div>
  <iframe id="playerFrame" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>

</section>

<div class="modal" id="authModal">
  <div class="modalBox">
    <h2>Cont Nubiru</h2>
    <div id="authMessage"></div>
    <input id="name" placeholder="Nume">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Parolă">
    <button onclick="register()">Creează cont</button>
    <button onclick="login()">Login</button>
    <button onclick="authModal.style.display='none'">Închide</button>
  </div>
</div>

<div class="modal" id="episodesModal">
  <div class="modalBox">
    <h2 id="episodesTitle">Episoade</h2>
    <div id="seasonsBox"></div>
    <div id="episodesBox"></div>
    <button onclick="episodesModal.style.display='none'">Închide</button>
  </div>
</div>

<script>
let token=localStorage.getItem("token")||"";
let user=JSON.parse(localStorage.getItem("user")||"null");
let items=[];
let heroItem=null;
let currentItem=null;

const fallbackPoster = "https://via.placeholder.com/300x450/111827/ffffff?text=Nubiru";

function safeImg(url){
  if(!url) return fallbackPoster;
  return url;
}

function authHeaders(){
  return token
    ? {Authorization:"Bearer "+token,"Content-Type":"application/json"}
    : {"Content-Type":"application/json"};
}

function showMsg(msg,type="error"){
  authMessage.innerHTML=`<p class="${type}">${msg}</p>`;
}

function renderUser(){
  userBox.innerHTML=user
    ? `<p class="small">Salut, ${user.name||user.email}</p><button onclick="logout()">Logout</button>

<button id="profileSwitchBtn" onclick="openProfilesOverlay()">👥 Schimbă profil</button>
`
    : `<button onclick="openAuth()">Login / Register</button>`;
}
renderUser();

function openAuth(){
  authMessage.innerHTML="";
  authModal.style.display="grid";
}


async function loadHomepageRails(){
  const userId = getActiveUserId();

  try{
    const res = await fetch("/homepage?user_id="+userId);
    const data = await res.json();

    renderRail("homeContinue", data.continueWatching || [], true);
    renderRail("homeTrending", data.trending || []);
    renderRail("homeAiPicks", data.aiPicks || []);
    renderRail("homeSemantic", data.semantic || []);
    renderRail("homeMovies", data.movies || []);
    renderRail("homeSeries", data.series || []);
  }catch(e){
    console.log("homepage rails error", e);
  }
}

function renderRail(id,data,isContinue=false){
  const box = document.getElementById(id);
  if(!box) return;

  const list = data || [];

  if(!list.length){
    box.innerHTML = "<span class='small'>Nimic disponibil.</span>";
    return;
  }

  box.innerHTML = list.map(x=>{
    if(isContinue){
      return `
      <div class="card" onclick='resumeContent(${JSON.stringify(x)})'>
        <img src="${x.poster_url || "https://via.placeholder.com/300x450"}">
        <div class="cardInfo">
          <b>${x.title}</b><br>
          <span class="small">Progres: ${x.percent || 0}%</span>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${x.percent || 0}%"></div>
          </div>
          <button onclick='event.stopPropagation();resumeContent(${JSON.stringify(x)})'>Resume</button>
        </div>
      </div>`;
    }

    return card(x);
  }).join("");
}

async function load(){
  const res=await fetch("/content/search?sort=popular");
  items=await res.json();
  heroItem=items[0];
  renderHero(heroItem);
  catalog.innerHTML=items.map(card).join("");
}
load();

setTimeout(()=>{
  const btn = document.getElementById("heroPlayBtn");
  if(btn){
    btn.onclick = function(){
      if(heroItem){
        playItem(heroItem);
      }else{
        alert("Nu există content selectat.");
      }
    };
  }
},1000);



let heroTrailerMuted = true;

async function loadHeroTrailer(item){
  try{
    if(!item) return;

    let old = document.getElementById("heroVideoBg");
    if(old) old.remove();

    const res = await fetch("/content-play/"+item.id);
    const data = await res.json();
    const trailer = data.trailer || data.primary;

    if(!trailer) return;

    let url = trailer.normalized_url || trailer.url || "";
    if(!url) return;

    url = toEmbed(url);

    if(url.includes("youtube.com/embed/")){
      url += (url.includes("?") ? "&" : "?") + "autoplay=1&mute=1&controls=0&loop=1&playlist=" + url.split("/embed/")[1].split("?")[0];
    }

    const iframe = document.createElement("iframe");
    iframe.id = "heroVideoBg";
    iframe.src = url;
    iframe.allow = "autoplay; fullscreen; picture-in-picture";
    iframe.setAttribute("allowfullscreen","true");

    hero.prepend(iframe);
  }catch(e){
    console.log("hero trailer error", e);
  }
}

function toggleHeroTrailer(){
  const frame = document.getElementById("heroVideoBg");
  if(!frame){
    if(heroItem) loadHeroTrailer(heroItem);
    return;
  }

  frame.style.display = frame.style.display === "none" ? "block" : "none";
}

function renderHero(item){
  if(!item)return;
  heroItem=item;
  heroTitle.innerText=item.title;
  heroDesc.innerText=item.description||"";
  hero.style.background=`linear-gradient(90deg,rgba(5,7,18,.95),rgba(5,7,18,.35)),url('${item.backdrop_url||item.poster_url||""}') center/cover`;
  loadHeroTrailer(item);
}

function escapeJson(obj){
  return JSON.stringify(obj).replace(/'/g,"&#39;");
}

function card(item){
  return `
  <div class="card" onclick='openItem(${escapeJson(item)})'>
    <img class="poster" src="${safeImg(item.poster_url)}" onerror="this.src='${fallbackPoster}'">
    <div class="cardInfo">
      <b>${item.title || ""}</b>
      <span class="small">${item.year || ""} ${item.genres || item.genre || ""}</span>
      <div class="cardButtons">
        <button onclick='event.stopPropagation();playItem(${escapeJson(item)})'>▶</button>
        <button onclick='event.stopPropagation();openEpisodes(${escapeJson(item)})'>📺</button>
        <button onclick='event.stopPropagation();addWatchlist(${item.id})'>❤️</button>
      </div>
    </div>
  </div>`;
}

async function search(){
  const p=new URLSearchParams();
  if(q.value)p.set("q",q.value);
  if(actor.value)p.set("actor",actor.value);
  if(genre.value)p.set("genre",genre.value);
  if(country.value)p.set("country",country.value);

  const res=await fetch("/content/search?"+p.toString());
  items=await res.json();
  catalog.innerHTML=items.map(card).join("");
  renderHero(items[0]);
}

function openItem(item){
  renderHero(item);
}

function getPlayable(item){
  return item.iframe_url || item.youtube_trailer || item.source_url || "";
}



let playerAvailableSources = [];

function renderSourceButtons(sources){
  const box = document.getElementById("playerSourceButtons");
  if(!box) return;

  playerAvailableSources = sources || [];

  box.innerHTML = playerAvailableSources.map((src,index)=>{
    const label = src.is_trailer ? "Trailer" : (src.label || ("Server "+(index+1)));
    const quality = src.quality ? " " + src.quality : "";
    const lang = src.language ? " " + src.language : "";
    return `<button style="background:#8b5cf6;color:white;padding:10px;border-radius:12px;border:0;font-weight:bold" onclick="playSourceIndex(${index})">${label}${quality}${lang}</button>`;
  }).join("");
}

function playSourceIndex(index){
  const src = playerAvailableSources[index];
  if(!src) return;

  const url = src.normalized_url || src.url;
  playerFrame.src = toEmbed(url);
  playerTitle.innerText = (currentItem?.title || "Player") + " - " + (src.label || src.source_type || "Source");
}


let pendingPlayItem = null;
let pendingSources = [];

function openSourcePicker(item, sources){
  pendingPlayItem = item;
  pendingSources = sources || [];

  sourcePickerTitle.innerText = item.title || "";

  sourcePickerList.innerHTML = pendingSources.map((src,i)=>{
    const label = src.is_trailer ? "🎬 Trailer" : (src.label || "▶ Server "+(i+1));
    const q = src.quality ? " - " + src.quality : "";
    const l = src.language ? " - " + src.language : "";
    return `
      <div class="episode">
        <div>
          <b>${label}${q}${l}</b>
          <p class="small">${src.detected_type || src.source_type || ""}</p>
        </div>
        <button onclick="playPickedSource(${i})">Play</button>
      </div>
    `;
  }).join("");

  sourcePickerModal.style.display = "grid";
}

function playPickedSource(index){
  const src = pendingSources[index];
  if(!src || !pendingPlayItem) return;

  const url = src.normalized_url || src.url;
  currentItem = pendingPlayItem;

  playerTitle.innerText = pendingPlayItem.title + " - " + (src.label || src.source_type || "Source");
  playerFrame.src = toEmbed(url);

  sourcePickerModal.style.display = "none";
  player.style.display = "block";

  fetch("/content/"+pendingPlayItem.id+"/view",{method:"POST"});
}

async function getSmartPlay(item){
  try{
    const res = await fetch("/content-play/"+item.id);
    const data = await res.json();
    const sources = data.sources || [];

    if(data.primary){
      return {
        url: data.primary.normalized_url || data.primary.url,
        type: data.primary.detected_type || data.primary.source_type || "iframe",
        label: data.primary.label || "Primary",
        sources: sources
      };
    }

    if(data.trailer){
      return {
        url: data.trailer.normalized_url || data.trailer.url,
        type: data.trailer.detected_type || data.trailer.source_type || "iframe",
        label: data.trailer.label || "Trailer",
        sources: sources
      };
    }
  }catch(e){
    console.log("getSmartPlay error", e);
  }

  return {
    url: getPlayable(item),
    type: "iframe",
    label: "Legacy",
    sources: []
  };
}


let playerSourcesList = [];

function renderPlayerSourceBar(sources){
  const bar = document.getElementById("playerSourceBar");
  if(!bar) return;

  playerSourcesList = sources || [];

  bar.innerHTML = playerSourcesList.map((src,i)=>{
    const label = src.is_trailer ? "🎬 Trailer" : (src.label || "▶ Server "+(i+1));

function playEpisode(ep, parentTitle){
  currentItem={id:ep.content_id,title:parentTitle || ep.title};
  playerTitle.innerText=`${parentTitle || ""} - S${ep.season_number}E${ep.episode_number}: ${ep.title}`;
  playerFrame.src=toEmbed(ep.iframe_url || ep.source_url || "");
  player.style.display="block";
  episodesModal.style.display="none";
}

function toEmbed(url){
  if(!url)return"";

  if(url.includes("<iframe")){
    const m=url.match(/src=["']([^"']+)["']/);
    return m?m[1]:"";
  }

  if(url.includes("youtube.com/watch")){
    const id=new URL(url).searchParams.get("v");
    return "https://www.youtube.com/embed/"+id;
  }

  if(url.includes("youtu.be/")){
    const id=url.split("youtu.be/")[1].split("?")[0];
    return "https://www.youtube.com/embed/"+id;
  }

  if(url.includes("vimeo.com/")){
    const id=url.split("vimeo.com/")[1].split("?")[0];
    return "https://player.vimeo.com/video/"+id;
  }

  if(url.includes("dailymotion.com/video/")){
    const id=url.split("/video/")[1].split("?")[0];
    return "https://www.dailymotion.com/embed/video/"+id;
  }

  return url;
}

  if(!next){
    alert("Nu există episod următor.");
    return;
  }

  playEpisode(next.id);
}

function getNextEpisode(){

  const all = currentSeriesData.episodes || [];
  const currentId = realEpisodeData.episode.id;

function markEpisodeCompletedAndNext(){

  if(!realEpisodeData){
    alert("Nu există episod activ");
    return;
  }

  const ep = realEpisodeData.episode;

  fetch("/watch-progress",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      user_id:getActiveUserId(),
      profile_id:getActiveProfileId(),
      content_id:ep.content_id,
      episode_id:ep.id,
      progress_seconds:ep.duration_seconds || 1440,
      duration_seconds:ep.duration_seconds || 1440,
      completed:true
    })
  })
  .then(r=>r.json())
  .then(()=>{

    const next = getNextEpisode();

    if(!next){
      alert("Serial terminat.");
      return;
    }

    let sec = 10;

    const old = document.getElementById("autoNextOverlay");
    if(old) old.remove();

    const overlay = document.createElement("div");
    overlay.id = "autoNextOverlay";

    overlay.style.cssText = `
      position:fixed;
      right:20px;
      bottom:80px;
      width:320px;
      background:#050712;
      border:2px solid #7c3aed;
      border-radius:20px;
      padding:20px;
      z-index:999999;
      color:white;
      box-shadow:0 0 40px rgba(124,58,237,.6);
    `;

    overlay.innerHTML = `
      <h3 style="margin:0 0 10px 0">▶ Următorul episod</h3>

      <div style="font-size:14px;color:#c4b5fd;margin-bottom:12px">
        S${next.season_number} E${next.episode_number}
      </div>

      <div style="font-weight:bold;margin-bottom:12px">
        ${next.title}
      </div>

      <div style="margin-bottom:15px">
        Rulează în <span id="nextEpCounter">10</span>s
      </div>

      <div style="display:flex;gap:10px">
        <button id="playNextNow">▶ Play now</button>
        <button id="cancelNextEp">Anulează</button>
      </div>
    `;

    document.body.appendChild(overlay);

    const interval = setInterval(()=>{

      sec--;

      const c = document.getElementById("nextEpCounter");

      if(c){
        c.innerText = sec;
      }

      if(sec <= 0){
        clearInterval(interval);
        overlay.remove();
        playEpisode(next.id);
      }

    },1000);

    document.getElementById("playNextNow").onclick = ()=>{
      clearInterval(interval);
      overlay.remove();
      playEpisode(next.id);
    };

    document.getElementById("cancelNextEp").onclick = ()=>{
      clearInterval(interval);
      overlay.remove();
    };

  })
  .catch(err=>{
    console.error(err);
    alert("Eroare auto next");
  });

}

async function selectNetflixProfile(profileId){
  const userId = user?.id || 1;

  const res = await fetch("/profiles/select",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      user_id:userId,
      profile_id:profileId
    })
  });

  const data = await res.json();

  if(data.ok){
    localStorage.setItem("activeProfileId",data.profile.id);
    localStorage.setItem("activeProfileName",data.profile.name);

    document.getElementById("profilesOverlay")?.remove();

    if(typeof forceHomepageRails==="function") forceHomepageRails();
    if(typeof loadHomepageRails==="function") loadHomepageRails();
    if(typeof loadHistory==="function") loadHistory();
    if(typeof loadAIRecommendations==="function") loadAIRecommendations();

    alert("Profil selectat: "+data.profile.name);
  }else{
    alert(data.error || "Eroare profil");
  }
}

async function createNetflixProfile(){
  const name = prompt("Nume profil:");
  if(!name) return;

  const userId = user?.id || 1;

  const res = await fetch("/profiles",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      user_id:userId,
      name:name,
      language:"ro",
      kid_mode:false
    })
  });

  const data = await res.json();

  if(data.ok){
    openProfilesOverlay();
  }else{
    alert(data.error || "Eroare creare profil");
  }
}



async function saveProfileProgressNow(){
  try{
    const profileId = localStorage.getItem("activeProfileId") || 1;

    if(!profileId || !currentItem) return;

    const episodeId = currentItem.episode_id || null;
    const season = realEpisodeData?.episode?.season_number || 1;
    const episode = realEpisodeData?.episode?.episode_number || 1;
    const duration = realEpisodeData?.episode?.duration_seconds || 1440;

    const watchedSeconds = playStartedAt
      ? Math.floor((Date.now() - playStartedAt) / 1000)
      : 0;

    await fetch("/profile-progress",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        profile_id:Number(profileId),
        content_id:currentItem.id,
        season,
        episode,
        progress_seconds:Math.max(30, watchedSeconds),
        duration_seconds:duration
      })
    });
  }catch(e){
    console.log("profile progress save error", e);
  }
}

function startProfileProgressAutoSave(){
  if(window.profileProgressTimer){
    clearInterval(window.profileProgressTimer);
  }

  window.profileProgressTimer = setInterval(()=>{
    saveProfileProgressNow();
  },15000);
}

function stopProfileProgressAutoSave(){
  if(window.profileProgressTimer){
    clearInterval(window.profileProgressTimer);
    window.profileProgressTimer = null;
  }
}

async function loadProfileContinueWatching(){
  const profileId = localStorage.getItem("activeProfileId") || 1;
  const res = await fetch("/profile-progress/"+profileId);
  const data = await res.json();

  const box = document.getElementById("homeContinue");
  if(!box) return;

  if(!data.length){
    box.innerHTML = "<span class='small'>Nimic disponibil.</span>";
    return;
  }

  box.innerHTML = data.map(x=>{
    const percent = x.duration_seconds
      ? Math.round((x.progress_seconds / x.duration_seconds) * 100)
      : 0;

    return `
      <div class="card" onclick="resumeProfileProgress(${x.content_id},${x.season},${x.episode})">
        <img src="${x.poster_url || "https://via.placeholder.com/300x450"}">
        <div class="cardInfo">
          <b>${x.title}</b><br>
          <span class="small">S${x.season} E${x.episode}</span><br>
          <span class="small">Progres: ${percent}%</span>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${percent}%"></div>
          </div>
          <button onclick="event.stopPropagation();resumeProfileProgress(${x.content_id},${x.season},${x.episode})">
            Resume
          </button>
        </div>
      </div>
    `;
  }).join("");
}

async function resumeProfileProgress(contentId, season, episode){
  const res = await fetch("/series-player/"+contentId);
  const data = await res.json();

  const ep = (data.episodes || []).find(e =>
    Number(e.season_number) === Number(season) &&
    Number(e.episode_number) === Number(episode)
  );

  if(ep){
    currentSeriesData = data;
    await playEpisode(ep.id);
  }else{
    const item = items.find(x=>x.id === contentId);
    if(item) playItem(item);
  }
}

async function runSemanticSearch(){
  const q =
    document.getElementById("searchInput")?.value ||
    document.getElementById("q")?.value ||
    "";

  const profileId = localStorage.getItem("activeProfileId") || 1;

  if(!q.trim()){
    if(typeof forceHomepageRails === "function"){
      forceHomepageRails();
    }
    return;
  }

  const res = await fetch(
    "/ai/search?q="+encodeURIComponent(q)+"&profile_id="+profileId
  );

  const data = await res.json();

  const main =
    document.getElementById("catalog") ||
    document.getElementById("homeTrending") ||
    document.querySelector(".main");

  if(!main) return;

  main.innerHTML = `
    <h2>🔎 AI Search: ${q}</h2>
    <div class="rail">
      ${data.length ? data.map(x=>`
        <div class="card" onclick='openItem(${JSON.stringify(x)})'>
          <img src="${x.poster_url || "https://via.placeholder.com/300x450"}">
          <div class="cardInfo">
            <b>${x.title}</b><br>
            <span class="small">${x.year || ""} ${x.genres || x.genre || ""}</span><br>
            <span class="small">Semantic score: ${x.semantic_score}</span><br>
            <button onclick='event.stopPropagation();playItem(${JSON.stringify(x)})'>▶</button>
            <button onclick='event.stopPropagation();openEpisodes(${JSON.stringify(x)})'>📺</button>
            <button onclick='event.stopPropagation();addWatchlist(${x.id})'>❤️</button>
          </div>
        </div>
      `).join("") : "<p>Nimic găsit semantic.</p>"}
    </div>
  `;
}

function installSemanticSearchHooks(){
  const inputs = [
    document.getElementById("searchInput"),
    document.getElementById("q")
  ].filter(Boolean);

  for(const input of inputs){
    if(input.dataset.semanticHooked) continue;
    input.dataset.semanticHooked = "1";

    input.addEventListener("keydown", e=>{
      if(e.key === "Enter"){
        runSemanticSearch();
      }
    });
  }

  const buttons = [...document.querySelectorAll("button")];

  for(const btn of buttons){
    if((btn.innerText || "").trim().toLowerCase() === "search"){
      if(btn.dataset.semanticHooked) continue;
      btn.dataset.semanticHooked = "1";
      btn.onclick = runSemanticSearch;
    }
  }
}

setTimeout(installSemanticSearchHooks,800);
